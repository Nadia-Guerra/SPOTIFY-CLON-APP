<app-navbar></app-navbar>

<div class="album-detail-container">
  <div class="left-section">
    <h1>Canciones del Álbum</h1>
    <app-playlist 
      [playlist]="tracks"
      (songSelected)="onSongSelected($event)"></app-playlist>
  </div>

  <div class="right-section">
    <app-song-info *ngIf="currentSong" [song]="currentSong" displayMode="main"></app-song-info>
    <app-audio-controller [currentSong]="currentSong" [playlist]="tracks"></app-audio-controller>
  </div>
</div>
