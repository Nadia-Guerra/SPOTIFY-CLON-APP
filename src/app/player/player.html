<div class="background-blur" 
     [style.background-image]="song() && song()!.album && song()!.album.images[0] ? 'url(' + song()!.album.images[0].url + ')' : ''"></div>
<app-navbar></app-navbar>

<div id="main-container">
  <div id="left-section">
    <app-album-grid></app-album-grid>
    <app-playlist 
      [playlist]="playlist"
      (songSelected)="onSongSelected($event)">
    </app-playlist>
  </div>

  <div id="right-section">
    <app-song-info *ngIf="song()" [song]="song()!" displayMode="main"></app-song-info>
    <app-audio-controller [currentSong]="song()" [playlist]="playlist"></app-audio-controller>
  </div>
</div>
