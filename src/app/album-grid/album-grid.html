<div class="album-grid">
  <div *ngFor="let album of albums" class="album-card">
    <img 
      [src]="album.images && album.images[0] ? album.images[0].url : 'https://via.placeholder.com/150'" 
      alt="Portada" 
      class="album-cover"
      (error)="$event.target.src='https://via.placeholder.com/150'">
    <div class="album-title">{{ album.name || 'Sin título' }}</div>
    <div class="album-year">{{ album.release_date ? album.release_date.slice(0, 4) : 'N/A' }}</div>
  </div>
</div>
