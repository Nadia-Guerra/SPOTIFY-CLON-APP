<div class="main-icons">
  <i class="fa-solid fa-arrow-left back-icon"></i>
  <i class="fa-regular fa-heart favorite-icon"></i>
</div>

<img [src]="song.album.images[0]?.url || 'https://via.placeholder.com/300'" 
     alt="Album Cover" 
     class="card-song-img">

<div class="card-song-details">
  <h1 class="card-song-title">{{song.name}}</h1>
  <h3 class="card-song-artist">{{song.artists[0]?.name || 'Unknown Artist'}}</h3>
</div>
